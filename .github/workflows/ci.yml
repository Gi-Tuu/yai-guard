name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline unit tests
        run: python -m unittest discover -s backend/tests -t backend -v

      - name: Redline check (no host execution outside sandbox)
        run: python scripts/check_no_host_exec.py

      - name: Offline demo (policy + trace hash chain)
        run: python backend/demo_offline.py
